<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site em Manutenção</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #0f0f0f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      padding: 52px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #f39c12, #e67e22);
    }

    .icon {
      width: 80px;
      height: 80px;
      background: rgba(243, 156, 18, 0.1);
      border: 2px solid rgba(243, 156, 18, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    .icon svg {
      width: 38px;
      height: 38px;
      fill: #f39c12;
    }

    .badge {
      display: inline-block;
      background: rgba(243, 156, 18, 0.1);
      border: 1px solid rgba(243, 156, 18, 0.25);
      color: #f39c12;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      line-height: 1.35;
    }

    .subtitle {
      font-size: 15px;
      color: #777;
      line-height: 1.75;
      margin-bottom: 36px;
    }

    .cta-text {
      font-size: 14px;
      color: #666;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 36px;
      border-radius: 8px;
      transition: opacity 0.2s, transform 0.2s;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #444;
      line-height: 1.7;
    }

    .footer-note a {
      color: #666;
      text-decoration: none;
    }

    .footer-note a:hover {
      color: #999;
    }

    @media (max-width: 540px) {
      .card {
        padding: 36px 24px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="card">

      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 6h2v5h-2V8zm0 7h2v2h-2v-2z"/>
        </svg>
      </div>

      <div class="badge">Manutenção</div>

      <h1>Este site está temporariamente indisponível</h1>

      <p class="subtitle">
        Estamos realizando ajustes para garantir a melhor experiência.<br>
        Em breve tudo estará funcionando normalmente.
      </p>

      <p class="cta-text">Para mais informações, entre em contato:</p>

      <a class="btn" href="https://wa.me/5518997330574" target="_blank">
        Falar com o suporte
      </a>

      <div class="footer-note">
        Agradecemos a compreensão.
      </div>

    </div>
  </div>

</body>
</html>
